name: Deploy Next.js to Baota

on:
  push:
    branches:
      - main

jobs:
  deploy-to-baota:
    runs-on: ubuntu-latest
    steps:
      - name: Fast SSH Trigger Git Pull & Reload on Baota
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          script: |
            cd /www/wwwroot/maogeo-app
            
            # 1. 宝塔本地快速拉取增量修改文件 (不拉取垃圾与缓存)
            git reset --hard HEAD
            git pull origin main
            
            # 2. 如果依赖未安装，宝塔本地安装
            # 3. 宝塔本地快速构建增量
            npm run build
            
            # 4. 平滑秒级重载 PM2
            pm2 reload ecosystem.config.js --env production || pm2 start server.js --name "maogeo-app"