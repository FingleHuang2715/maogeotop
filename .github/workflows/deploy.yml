name: Deploy Next.js

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'  # 开启 npm 依赖缓存，大幅加快构建速度

      - name: Install dependencies
        run: npm ci     # 比 npm install 更快速且稳定的 CI 安装命令

      - name: Build project
        run: npm run build

      - name: Prepare deployment files
        run: |
          # 复制 public 目录和静态资源到 standalone 架构目录中
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # 如果有 ecosystem.config.js，也一并拷过去
          cp ecosystem.config.js .next/standalone/ 2>/dev/null || true

      - name: Deploy & Rollback-Ready to Baota Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          script: |
            # 1. 自动生成当前打包的时间戳版本号
            RELEASE_NAME="release-$(date +%Y%m%d%H%M%S)"
            APP_DIR="/www/wwwroot/maogeo-app"
            RELEASE_DIR="$APP_DIR/releases/$RELEASE_NAME"

            # 2. 创建新版本目录
            mkdir -p "$RELEASE_DIR"

            # 3. 将本地打包解压拷贝至新版本目录
            # (在此步骤中完成拷贝)

      - name: Upload Build Artifacts to Release Dir
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          source: ".next/standalone/*"
          target: "/www/wwwroot/maogeo-app/releases/latest"
          strip_components: 2

      - name: Switch Symlink & PM2 Reload (Zero Downtime)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          script: |
            APP_DIR="/www/wwwroot/maogeo-app"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            NEW_RELEASE="$APP_DIR/releases/$TIMESTAMP"

            # 将 latest 重命名为具体的时间戳版本目录
            mv "$APP_DIR/releases/latest" "$NEW_RELEASE"

            # 原子切换软链接 current -> 新版本
            ln -sfn "$NEW_RELEASE" "$APP_DIR/current"

            # 只保留最新的 5 个历史版本，自动清理旧版本节省磁盘空间
            cd "$APP_DIR/releases" && ls -t | tail -n +6 | xargs rm -rf 2>/dev/null || true

            # 平滑重载 PM2 进程
            cd "$APP_DIR/current"
            pm2 startOrReload ecosystem.config.js --env production || pm2 start server.js --name "maogeo-app"