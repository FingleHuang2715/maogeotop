name: Deploy Next.js

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'  # 开启 npm 依赖缓存，大幅加快构建速度

      - name: Install dependencies
        run: npm ci     # 比 npm install 更快速且稳定的 CI 安装命令

      - name: Build project
        run: npm run build

      - name: Prepare deployment files
        run: |
          # 复制 public 目录和静态资源到 standalone 架构目录中
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # 如果有 ecosystem.config.js，也一并拷过去
          cp ecosystem.config.js .next/standalone/ 2>/dev/null || true

      - name: Deploy to Baota Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          source: ".next/standalone/*"  # 只上传轻量级的 standalone 部署包
          target: "/www/wwwroot/maogeo-app"
          strip_components: 2           # 移除路径前缀，直接解压到 target 目录下

      - name: Restart PM2 process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          script: |
            cd /www/wwwroot/maogeo-app
            pm2 startOrReload ecosystem.config.js --env production || pm2 start server.js --name "maogeo-app"