name: Deploy Next.js to Baota

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Standalone Project on GitHub Cloud (Zero Server Load)
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp ecosystem.config.js .next/standalone/ 2>/dev/null || true

      - name: Deploy Lightweight Bundle to Baota
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          source: ".next/standalone/*"
          target: "/www/wwwroot/maogeo-app"
          strip_components: 2

      - name: Fast PM2 Reload on Baota
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 6808 }}
          script: |
            cd /www/wwwroot/maogeo-app
            pm2 reload ecosystem.config.js --env production || pm2 start server.js --name "maogeo-app"